[tool.pixi]
dependencies.pytask = "*"
dependencies.python = "~=3.13"
project.name = "toy-project-pytask"
project.channels = [ "conda-forge" ]
project.platforms = [ "linux-64", "osx-64", "osx-arm64", "win-64" ]
pypi-dependencies.pdbp = "*"

[tool.pytask]
ini_options.paths = [ "." ]
ini_options.ignore = [ ".pixi" ]
ini_options.pdbcls = "pdbp:Pdb"
